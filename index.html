<!DOCTYPE html>
<html>
    <head>
        <title>Student Registration</title>
    </head>
    <body>
        <h2>Student Registration Form</h2>
        <form id="studentForm">
            <input type="text" id="name" name="name" placeholder="Name" required><br><br>
            <input type="email" id="email" name="email" placeholder="Email" required><br><br>
            <input type="text" id="phone" name="phone" placeholder="Phone Number" required><br><br>
            <input type="number" id="age" name="age" placeholder="Age" required><br><br>
            <input type="text" id="address" name="address" placeholder="Address" required><br><br>
            <input type="text" id="course" name="course" placeholder="Course" required><br><br>
            <button type="submit">Register</button>
        </form>
            <p id="message"></p>
            <h3>Registered Students</h3>
            <table border="1" id="studentTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone Number</th>
                        <th>Age</th>
                        <th>Address</th>
                        <th>Course</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <script src="script.js"></script>
        </body>
    </head>
</html>
